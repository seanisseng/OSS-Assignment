name: Publish approved clarification
on:
  workflow_dispatch:
    inputs:
      analysis_run:
        description: Successful analysis run ID
        required: true
        type: string
      recommendation_hash:
        description: SHA256 of exact canonical JSON recommendation reviewed
        required: true
        type: string
permissions: {}
concurrency:
  group: clarification-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'seanisseng/OSS-Assignment' && github.ref == 'refs/heads/main' && vars.CLARIFICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: clarification-publication
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: clarification-validated
          path: staged
          run-id: ${{ inputs.analysis_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: clarification-input
          path: trusted-input
          run-id: ${{ inputs.analysis_run }}
          github-token: ${{ github.token }}
      - name: Validate provenance, exact approval and limits; post once
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RUN: ${{ inputs.analysis_run }}
          APPROVED_HASH: ${{ inputs.recommendation_hash }}
          ENABLED: ${{ vars.CLARIFICATION_ENABLED }}
        run: python -m scripts.publish
